DEFAULT microos
PROMPT 0
TIMEOUT 20

UI menu.c32
MENU TITLE ====================================================
MENU TITLE            MICROOS - Minimal Linux v1.0.0
MENU TITLE ====================================================

LABEL microos
    MENU LABEL MicroOS (Default - Live RAM Mode)
    KERNEL /boot/vmlinuz
    INITRD /boot/initrd.gz
    APPEND quiet loglevel=3 console=tty0 console=ttyS0,115200

LABEL microos_debug
    MENU LABEL MicroOS (Verbose / Hardware Debug Mode)
    KERNEL /boot/vmlinuz
    INITRD /boot/initrd.gz
    APPEND debug console=tty0 console=ttyS0,115200
