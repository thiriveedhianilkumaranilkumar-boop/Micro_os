DEFAULT microos
PROMPT 0
TIMEOUT 20

UI menu.c32
MENU TITLE ====================================================
MENU TITLE       MICROOS RUST EDITION v2.0 - Minimal Linux
MENU TITLE ====================================================

LABEL microos
    MENU LABEL MicroOS Rust Edition v2.0 (Live RAM Mode)
    KERNEL /boot/vmlinuz
    INITRD /boot/initrd.gz
    APPEND quiet loglevel=3 console=ttyS0,115200 console=tty0

LABEL microos_debug
    MENU LABEL MicroOS Rust Edition v2.0 (Verbose Debug Mode)
    KERNEL /boot/vmlinuz
    INITRD /boot/initrd.gz
    APPEND debug console=ttyS0,115200 console=tty0
