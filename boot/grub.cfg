set timeout=3
set default=0

menuentry "MicroOS Rust Edition v2.0 (x86_64 Minimal Linux)" {
    linux /boot/vmlinuz quiet loglevel=3 console=ttyS0,115200 console=tty0
    initrd /boot/initrd.gz
}

menuentry "MicroOS Rust Edition v2.0 (Verbose Debug Mode)" {
    linux /boot/vmlinuz debug console=ttyS0,115200 console=tty0
    initrd /boot/initrd.gz
}
