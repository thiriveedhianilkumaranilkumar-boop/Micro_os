set timeout=3
set default=0

menuentry "MicroOS v1.0.0 (x86_64 Minimal Linux)" {
    linux /boot/vmlinuz quiet loglevel=3 console=tty0 console=ttyS0,115200
    initrd /boot/initrd.gz
}

menuentry "MicroOS v1.0.0 (Verbose Debug Mode)" {
    linux /boot/vmlinuz debug console=tty0 console=ttyS0,115200
    initrd /boot/initrd.gz
}
